openapi: 3.1.0
info:
  title: Deadlines API
  version: 0.9.0
  description: API local do Deadlines. O cadastro exige confirmação de e-mail antes da ativação e do login; as rotas administrativas de usuários permanecem abertas apenas durante o desenvolvimento.
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
tags:
  - name: Operations
  - name: Users
  - name: Authentication
  - name: Email
  - name: Sessions
  - name: Organizations
  - name: Permissions
  - name: Roles
  - name: Members
  - name: Invitations
paths:
  /health:
    get:
      tags: [Operations]
      summary: Verifica se o backend está em execução
      operationId: getHealth
      responses:
        "200":
          description: Backend em execução
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Registra um usuário pendente e envia a confirmação de e-mail
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuário pendente de confirmação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Autentica um usuário
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotaciona o refresh token e emite novos tokens
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoga o refresh token informado
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: Sessão encerrada
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Retorna o usuário autenticado
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/password:
    patch:
      tags: [Authentication]
      summary: Altera a senha do usuário autenticado
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Senha alterada, outras sessões revogadas e sessão atual renovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Senha atual inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/auth/email/verify:
    post:
      tags: [Email]
      summary: Confirma o e-mail com um token de uso único
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: E-mail confirmado
        "400":
          $ref: "#/components/responses/InvalidEmailVerificationToken"
  /api/v1/auth/email/resend:
    post:
      tags: [Email]
      summary: Reenvia a confirmação sem revelar se a conta existe
      operationId: resendEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "204":
          description: Solicitação aceita
  /api/v1/auth/forgot-password:
    post:
      tags: [Email]
      summary: Solicita a recuperação de senha
      description: Sempre retorna sucesso para evitar enumeração de contas.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: Solicitação aceita
  /api/v1/auth/reset-password:
    post:
      tags: [Email]
      summary: Redefine a senha com um token de uso único
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Senha redefinida e sessões revogadas
        "400":
          $ref: "#/components/responses/InvalidPasswordResetToken"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: Lista as sessões ativas do usuário autenticado
      operationId: listSessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessões ativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Sessions]
      summary: Revoga uma sessão do usuário autenticado
      operationId: revokeSession
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sessão revogada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Sessão não encontrada para o usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/sessions/revoke-all:
    post:
      tags: [Sessions]
      summary: Revoga todas as sessões do usuário autenticado
      operationId: revokeAllSessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Todas as sessões foram revogadas
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/organizations:
    post:
      tags: [Organizations]
      summary: Cria a organização inicial do usuário autenticado
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organização criada e usuário associado como proprietário
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug já utilizado ou usuário já associado a uma organização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/organizations/current:
    get:
      tags: [Organizations]
      summary: Busca a organização atual do usuário autenticado
      operationId: getCurrentOrganization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organização e papel atuais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Usuário ainda não pertence a uma organização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Organizations]
      summary: Atualiza a organização atual
      description: Disponível somente para o proprietário da organização.
      operationId: updateCurrentOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organização atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Usuário não é o proprietário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuário ainda não pertence a uma organização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug já utilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/permissions:
    get:
      tags: [Permissions]
      summary: Lista permissões do sistema e da organização atual
      operationId: listPermissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissões disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Permissions]
      summary: Cria uma permissão customizada
      operationId: createPermission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePermissionRequest"
      responses:
        "201":
          description: Permissão criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Apenas o proprietário pode criar permissões
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/permissions/{permissionId}:
    parameters:
      - $ref: "#/components/parameters/PermissionId"
    get:
      tags: [Permissions]
      summary: Busca uma permissão
      operationId: getPermission
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissão encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Permissions]
      summary: Atualiza uma permissão customizada
      operationId: updatePermission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionRequest"
      responses:
        "200":
          description: Permissão atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "409":
          description: Permissão do sistema é imutável ou chave já utilizada
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Permissions]
      summary: Exclui uma permissão customizada
      operationId: deletePermission
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Permissão excluída
        "409":
          description: Permissões do sistema não podem ser excluídas
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: Lista os papéis da organização atual
      operationId: listRoles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Papéis disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
    post:
      tags: [Roles]
      summary: Cria um papel customizado
      operationId: createRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Papel criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/RoleId"
    get:
      tags: [Roles]
      summary: Busca um papel
      operationId: getRole
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Papel encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Roles]
      summary: Atualiza um papel customizado
      operationId: updateRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Papel atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "409":
          description: Papel do sistema é imutável ou chave já utilizada
    delete:
      tags: [Roles]
      summary: Exclui um papel customizado
      operationId: deleteRole
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Papel excluído
        "409":
          description: Papéis do sistema não podem ser excluídos
  /api/v1/roles/{roleId}/permissions:
    parameters:
      - $ref: "#/components/parameters/RoleId"
    get:
      tags: [Roles]
      summary: Lista permissões atribuídas ao papel
      operationId: listRolePermissions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Permissões atribuídas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
    put:
      tags: [Roles]
      summary: Substitui todas as permissões atribuídas ao papel
      operationId: replaceRolePermissions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: Permissões atribuídas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionList"
        "409":
          description: As permissões do proprietário não podem ser alteradas
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/members:
    get:
      tags: [Members]
      summary: Lista membros ativos da organização atual
      operationId: listMembers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membros ativos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/MemberId"
    get:
      tags: [Members]
      summary: Busca um membro da organização atual
      operationId: getMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Members]
      summary: Altera a role de um membro
      operationId: updateMemberRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: Role alterada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: Apenas o proprietário pode alterar membros
        "409":
          description: O proprietário não pode ser reatribuído
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Members]
      summary: Remove um membro da organização
      operationId: removeMember
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Membro removido
        "403":
          description: Apenas o proprietário pode remover membros
        "409":
          description: O proprietário não pode ser removido
  /api/v1/invitations:
    get:
      tags: [Invitations]
      summary: Lista convites da organização atual
      operationId: listInvitations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Convites da organização
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
    post:
      tags: [Invitations]
      summary: Cria e envia um convite
      operationId: createInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Convite criado e enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "403":
          description: Apenas o proprietário pode criar convites
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/invitations/preview:
    get:
      tags: [Invitations]
      summary: Consulta os dados públicos de um convite pelo token
      operationId: previewInvitation
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados do convite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "422":
          description: Convite inválido ou expirado
  /api/v1/invitations/accept:
    post:
      tags: [Invitations]
      summary: Aceita um convite usando a conta autenticada
      operationId: acceptInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Membership criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          description: O convite pertence a outro e-mail
        "409":
          description: Usuário já pertence a uma organização
        "422":
          description: Convite inválido ou expirado
  /api/v1/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    get:
      tags: [Invitations]
      summary: Busca um convite da organização atual
      operationId: getInvitation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Convite encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Invitations]
      summary: Revoga um convite pendente
      operationId: revokeInvitation
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Convite revogado
  /api/v1/invitations/{invitationId}/resend:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      tags: [Invitations]
      summary: Renova o token e reenvia um convite pendente ou expirado
      operationId: resendInvitation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Convite renovado e enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /api/v1/users:
    post:
      tags: [Users]
      summary: Cria um usuário
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuário criado
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [Users]
      summary: Lista usuários
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Busca o perfil do usuário autenticado
      operationId: getOwnProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil do usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      summary: Atualiza o perfil do usuário autenticado
      operationId: updateOwnProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Busca um usuário
      operationId: getUser
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [Users]
      summary: Atualiza parcialmente um usuário
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Users]
      summary: Desativa um usuário
      operationId: disableUser
      responses:
        "204":
          description: Usuário desativado
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: Corpo da requisição inválido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: E-mail já utilizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Usuário não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credenciais ou token inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidEmailVerificationToken:
      description: Token de confirmação inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidPasswordResetToken:
      description: Token de redefinição inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: [string, "null"]
          format: uri
        phone:
          type: [string, "null"]
          maxLength: 32
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    RegistrationResponse:
      type: object
      required: [user, message]
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
          const: Confirm your email to activate your account
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, refreshToken]
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
        refreshToken:
          type: string
          writeOnly: true
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          writeOnly: true
        password:
          type: string
          minLength: 12
          maxLength: 72
          writeOnly: true
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/User"
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri
        phone:
          type: string
          maxLength: 32
        status:
          type: string
          enum: [pending, active, disabled]
    UpdateOwnProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    User:
      type: object
      required: [id, email, status, profile, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum: [pending, active, disabled]
        profile:
          $ref: "#/components/schemas/UserProfile"
        emailVerifiedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserProfile:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
        phone:
          type: [string, "null"]
    UserList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
        totalPages:
          type: integer
    Session:
      type: object
      required: [id, expiresAt, createdAt, isCurrent]
      properties:
        id:
          type: string
          format: uuid
        userAgent:
          type: [string, "null"]
        ipAddress:
          type: [string, "null"]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
    SessionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    UpdateOrganizationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    Organization:
      type: object
      required: [id, name, slug, role, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        role:
          type: string
          enum: [owner, member]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePermissionRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 2
          maxLength: 100
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 500
    UpdatePermissionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
    Permission:
      type: object
      required: [id, key, name, isSystem, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PermissionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 2
          maxLength: 80
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: [string, "null"]
          maxLength: 500
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
    ReplaceRolePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Role:
      type: object
      required: [id, key, name, isSystem, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RoleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    UpdateMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
    Member:
      type: object
      required: [id, userId, email, firstName, lastName, role, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joinedAt:
          type: string
          format: date-time
    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, roleId]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        roleId:
          type: string
          format: uuid
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
    Invitation:
      type: object
      required: [id, organizationId, organizationName, email, role, status, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    InvitationPreview:
      type: object
      required: [organizationName, email, roleName, status, expiresAt]
      properties:
        organizationName:
          type: string
        email:
          type: string
          format: email
        roleName:
          type: string
        status:
          type: string
          enum: [pending, accepted, revoked, expired]
        expiresAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: string
