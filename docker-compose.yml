name: deadlines

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-deadlines}
      POSTGRES_USER: ${DATABASE_USER:-deadlines}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-deadlines}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-deadlines} -d ${DATABASE_NAME:-deadlines}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-deadlines}
      DATABASE_USER: ${DATABASE_USER:-deadlines}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-deadlines}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      PORT: 8080
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  database-data:
