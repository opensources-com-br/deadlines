name: deadlines

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-deadlines}
      POSTGRES_USER: ${DATABASE_USER:-deadlines}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-deadlines}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-deadlines} -d ${DATABASE_NAME:-deadlines}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
