name: opensources

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-opensources}
      POSTGRES_USER: ${DATABASE_USER:-opensources}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-opensources}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-opensources} -d ${DATABASE_NAME:-opensources}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-opensources}
      DATABASE_USER: ${DATABASE_USER:-opensources}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-opensources}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-now}
      JWT_ISSUER: ${JWT_ISSUER:-opensources}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-opensources-api}
      JWT_ACCESS_EXPIRATION_SECONDS: ${JWT_ACCESS_EXPIRATION_SECONDS:-900}
      JWT_REFRESH_EXPIRATION_SECONDS: ${JWT_REFRESH_EXPIRATION_SECONDS:-2592000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_FROM: ${MAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_WEB_URL: ${APP_WEB_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      EMAIL_VERIFICATION_EXPIRATION_SECONDS: ${EMAIL_VERIFICATION_EXPIRATION_SECONDS:-86400}
      PASSWORD_RESET_EXPIRATION_SECONDS: ${PASSWORD_RESET_EXPIRATION_SECONDS:-3600}
      INVITATION_EXPIRATION_SECONDS: ${INVITATION_EXPIRATION_SECONDS:-604800}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  database-data:
